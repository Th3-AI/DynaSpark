<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DynaSpark API Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            /* Light theme (default) */
            --primary-color: #4b5563;
            --secondary-color: #374151;
            --background-color: #f8fafc;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
            --error-color: #ef4444;
            --success-color: #22c55e;
            --card-bg: #ffffff;
            --hover-bg: #f3f4f6;
            --input-bg: #ffffff;
            --shadow-color: rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --primary-color: #9ca3af;
            --secondary-color: #d1d5db;
            --background-color: #111827;
            --text-color: #f3f4f6;
            --border-color: #374151;
            --error-color: #f87171;
            --success-color: #4ade80;
            --card-bg: #1f2937;
            --hover-bg: #374151;
            --input-bg: #374151;
            --shadow-color: rgba(0, 0, 0, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            font-family: 'Inter', sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem 1rem;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px var(--shadow-color);
            padding: 2rem;
            margin-bottom: 2rem;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .content-wrapper {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2rem;
            align-items: start;
        }

        .sidebar {
            background-color: var(--hover-bg);
            padding: 1.5rem;
            border-radius: 12px;
            position: sticky;
            top: 2rem;
        }

        .main-content {
            min-width: 0; /* Prevents grid item from overflowing */
        }

        h1 {
            font-size: 2rem;
            text-align: center;
            margin-bottom: 2rem;
            color: var(--text-color);
            font-weight: 600;
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--text-color);
            font-weight: 600;
        }

        #tabs {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
            background-color: var(--hover-bg);
            padding: 0.5rem;
            border-radius: 12px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .tab {
            padding: 0.75rem 1.25rem;
            cursor: pointer;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s ease;
            color: var(--text-color);
            min-width: 120px;
            text-align: center;
        }

        .tab:hover {
            background-color: var(--card-bg);
        }

        .tab.active {
            background-color: var(--primary-color);
            color: white;
        }

        #content > div {
            display: none;
        }

        #content > div.active {
            display: block;
        }

        .input-group {
            margin-bottom: 0;
        }

        .input-group label {
            font-size: 0.9rem;
            margin-bottom: 0.25rem;
        }

        .watermark-group {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 1rem;
            align-items: start;
            margin-bottom: 1.25rem;
        }

        .watermark-toggle {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .watermark-input {
            display: none;
        }

        .watermark-input.active {
            display: block;
        }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            background-color: var(--input-bg);
            color: var(--text-color);
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            padding: 0.875rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
            width: 100%;
            font-size: 0.95rem;
        }

        button:hover {
            background-color: var(--secondary-color);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background-color: var(--border-color);
            cursor: not-allowed;
            transform: none;
        }

        #chat-box {
            height: 400px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1.25rem;
            background-color: var(--card-bg);
        }

        .message {
            margin-bottom: 1rem;
            padding: 0.875rem 1rem;
            border-radius: 12px;
            max-width: 85%;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .user-message {
            background-color: var(--primary-color);
            color: white;
            margin-left: auto;
        }

        .ai-message {
            background-color: var(--hover-bg);
            margin-right: auto;
        }

        .error-message {
            background-color: var(--error-color);
            color: white;
            margin-right: auto;
        }

        .loading {
            text-align: center;
            padding: 1rem;
            color: var(--primary-color);
            font-weight: 500;
            font-size: 0.95rem;
        }

        .loading-spinner {
            display: inline-block;
            width: 2rem;
            height: 2rem;
            border: 3px solid var(--hover-bg);
            border-radius: 50%;
            border-top-color: var(--primary-color);
            animation: spin 1s linear infinite;
            margin-right: 0.5rem;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .image-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            background-color: var(--hover-bg);
            border-radius: 12px;
            margin: 1rem 0;
        }

        .model-selector {
            background-color: var(--card-bg);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            border: 1px solid var(--border-color);
        }

        .parameters-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .voice-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            background-color: var(--hover-bg);
            padding: 1.25rem;
            border-radius: 12px;
        }

        .voice-option {
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            background-color: var(--card-bg);
            font-size: 0.95rem;
        }

        .voice-option:hover {
            border-color: var(--primary-color);
            transform: translateY(-1px);
        }

        .voice-option.selected {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        #rate-limit-info {
            text-align: center;
            margin-top: 1.5rem;
            padding: 0.75rem;
            background-color: var(--hover-bg);
            border-radius: 8px;
            font-size: 0.9rem;
            color: var(--text-color);
        }

        .audio-player {
            width: 100%;
            margin-top: 1rem;
            border-radius: 8px;
        }

        #generated-image {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            margin-top: 1rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
        }

        .checkbox-group input[type="checkbox"] {
            width: 1.25rem;
            height: 1.25rem;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }

        .checkbox-group label {
            font-size: 0.95rem;
            cursor: pointer;
        }

        @media (max-width: 1024px) {
            .content-wrapper {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: static;
            }
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem 0.5rem;
            }

            .container {
                padding: 1rem;
            }

            .watermark-group {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.75rem;
            }

            h2 {
                font-size: 1.25rem;
            }

            .tab {
                padding: 0.5rem 1rem;
                min-width: 100px;
                font-size: 0.9rem;
            }

            .parameters-grid {
                grid-template-columns: 1fr;
            }

            .message {
                max-width: 95%;
            }

            .theme-toggle {
                top: 0.5rem;
                right: 0.5rem;
            }
        }

        .footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 1rem 0;
            flex-wrap: wrap;
        }

        .social-link {
            color: var(--text-color);
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            background-color: var(--hover-bg);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }

        .social-link i {
            font-size: 1.1rem;
            width: 1.25rem;
            text-align: center;
        }

        .social-link:hover {
            background-color: var(--primary-color);
            color: white;
            transform: translateY(-1px);
        }

        .docs-link {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .docs-link:hover {
            text-decoration: underline;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .button-group button {
            flex: 1;
        }

        .download-btn {
            background-color: var(--success-color);
        }

        .download-btn:hover {
            background-color: #16a34a;
        }

        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.5rem;
            border-radius: 50%;
            width: 2.5rem;
            height: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 4px var(--shadow-color);
            z-index: 1000;
        }

        .theme-toggle:hover {
            background-color: var(--hover-bg);
            transform: translateY(-1px);
        }

        .theme-toggle i {
            font-size: 1.25rem;
        }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle dark mode">
        <i class="fas fa-moon"></i>
    </button>
    <div class="container">
    <h1>DynaSpark API Interface</h1>
    <div id="tabs">
            <div id="chat-tab" class="tab active" onclick="switchTab('chat')">Text Chat</div>
            <div id="image-tab" class="tab" onclick="switchTab('image')">Image Generator</div>
            <div id="audio-tab" class="tab" onclick="switchTab('audio')">Audio Generator</div>
        </div>

        <div id="content">
            <!-- Chat Tab -->
            <div id="chat-content" class="active">
                <div class="content-wrapper">
                    <div class="sidebar">
                        <h3 style="margin-bottom: 1rem; font-size: 1.1rem;">Settings</h3>
                        <div class="model-selector">
                            <div class="input-group">
                                <label for="text-model">Model</label>
                                <select id="text-model">
                                    <option value="openai">OpenAI GPT-4.1-mini</option>
                                    <option value="openai-fast">OpenAI GPT-4.1-nano</option>
                                    <option value="openai-large">OpenAI GPT-4.1</option>
                                    <option value="qwen-coder">Qwen 2.5 Coder 32B</option>
                                    <option value="llamascout">Llama 4 Scout 17B</option>
                                    <option value="mistral">Mistral Small 3.1 24B</option>
                                    <option value="unity">Unity Unrestricted Agent</option>
                                    <option value="mirexa">Mirexa AI Companion</option>
                                    <option value="searchgpt">SearchGPT</option>
                                    <option value="evil">Evil</option>
                                    <option value="deepseek-reasoning">DeepSeek R1</option>
                                    <option value="elixposearch">ElixpoSearch</option>
                                    <option value="phi">Phi-4 Instruct</option>
                                    <option value="hypnosis-tracy">Hypnosis Tracy 7B</option>
                                    <option value="grok">xAi Grok-3 Mini</option>
                                    <option value="sur">Sur AI Assistant</option>
                                    <option value="bidara">BIDARA - NASA Assistant</option>
                                </select>
                            </div>
                        </div>
                        <div class="parameters-grid">
                            <div class="input-group">
                                <label for="temperature">Temperature (0.0-3.0)</label>
                                <input type="number" id="temperature" min="0" max="3" step="0.1" value="0.8">
                            </div>
                            <div class="input-group">
                                <label for="top-p">Top P (0.0-1.0)</label>
                                <input type="number" id="top-p" min="0" max="1" step="0.1" value="0.9">
                            </div>
                            <div class="input-group">
                                <label for="presence-penalty">Presence Penalty (-2.0-2.0)</label>
                                <input type="number" id="presence-penalty" min="-2" max="2" step="0.1" value="0">
                            </div>
                            <div class="input-group">
                                <label for="frequency-penalty">Frequency Penalty (-2.0-2.0)</label>
                                <input type="number" id="frequency-penalty" min="-2" max="2" step="0.1" value="0">
                            </div>
                        </div>
                    </div>
                    <div class="main-content">
            <div id="chat-box"></div>
                        <div class="input-group">
                            <textarea id="chat-input" placeholder="Type your message..." rows="3"></textarea>
                        </div>
                        <button id="chat-send">Send Message</button>
                    </div>
                </div>
            </div>

            <!-- Image Tab -->
            <div id="image-content">
                <div class="content-wrapper">
                    <div class="sidebar">
                        <h3 style="margin-bottom: 1rem; font-size: 1.1rem;">Settings</h3>
                        <div class="model-selector">
                            <div class="input-group">
                                <label for="image-model">Model</label>
                                <select id="image-model">
                                    <option value="flux">Flux</option>
                                    <option value="turbo">Turbo</option>
                                    <option value="gptimage">GPT Image</option>
                                </select>
                            </div>
                        </div>
                        <div class="parameters-grid">
                            <div class="input-group">
                                <label for="image-width">Width (64-2048)</label>
                                <input type="number" id="image-width" min="64" max="2048" value="768">
                            </div>
                            <div class="input-group">
                                <label for="image-height">Height (64-2048)</label>
                                <input type="number" id="image-height" min="64" max="2048" value="768">
                            </div>
                        </div>
                        <div class="watermark-group">
                            <div class="watermark-toggle">
                                <input type="checkbox" id="nologo">
                                <label for="nologo">Custom Watermark</label>
                            </div>
                            <div class="input-group watermark-input" id="watermark-input">
                                <label for="watermark-text">Watermark Text</label>
                                <input type="text" id="watermark-text" placeholder="Enter custom watermark text">
                            </div>
                        </div>
                    </div>
                    <div class="main-content">
                        <div class="input-group">
                            <label for="image-prompt">Image Description</label>
                            <textarea id="image-prompt" placeholder="Describe the image you want to generate..." rows="3"></textarea>
                        </div>
                        <div class="button-group">
                            <button id="image-generate">Generate Image</button>
                            <button id="download-image" class="download-btn" style="display: none;">Download Image</button>
                        </div>
                        <div id="loading" class="loading" style="display:none;">
                            <div class="loading-spinner"></div>
                            Generating image...
                        </div>
                        <div id="image-loading" class="image-loading" style="display:none;">
                            <div class="loading-spinner"></div>
                            Loading image...
                        </div>
                        <div id="image-response"></div>
                    </div>
                </div>
            </div>

            <!-- Audio Tab -->
            <div id="audio-content">
                <div class="content-wrapper">
                    <div class="sidebar">
                        <h3 style="margin-bottom: 1rem; font-size: 1.1rem;">Voice Selection</h3>
                        <div class="voice-selector">
                            <div class="voice-option selected" data-voice="alloy">Alloy</div>
                            <div class="voice-option" data-voice="echo">Echo</div>
                            <div class="voice-option" data-voice="fable">Fable</div>
                            <div class="voice-option" data-voice="onyx">Onyx</div>
                            <div class="voice-option" data-voice="nova">Nova</div>
                            <div class="voice-option" data-voice="shimmer">Shimmer</div>
                        </div>
                    </div>
                    <div class="main-content">
                        <div class="input-group">
                            <label for="audio-prompt">Text to Convert to Speech</label>
                            <textarea id="audio-prompt" placeholder="Enter the text you want to convert to speech..." rows="3"></textarea>
                        </div>
                        <button id="audio-generate">Generate Audio</button>
                        <div id="audio-loading" class="loading" style="display:none;">Generating audio...</div>
                        <div id="audio-response"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="rate-limit-info"></div>
        
        <footer class="footer">
            <a href="/docs.html" class="docs-link"><i class="fas fa-book"></i> View API Documentation</a>
            <div class="social-links">
                <a href="https://github.com/Th3-AI/DynaSpark" target="_blank" class="social-link"><i class="fab fa-github"></i>GitHub</a>
                <a href="https://youtube.com/@Th3Coder" target="_blank" class="social-link"><i class="fab fa-youtube"></i>YouTube</a>
                <a href="https://instagram.com/th3_c0der" target="_blank" class="social-link"><i class="fab fa-instagram"></i>Instagram</a>
                <a href="https://www.linkedin.com/in/Th3-C0der" target="_blank" class="social-link"><i class="fab fa-linkedin"></i>LinkedIn</a>
                <a href="https://ko-fi.com/th3coder" target="_blank" class="social-link"><i class="fas fa-coffee"></i>Support on Ko-fi</a>
            </div>
            <p>Made with ❤️ by <a href="https://github.com/Th3-C0der">Th3-C0der</a></p>
        </footer>
    </div>

    <script>
        // Theme management
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            const icon = document.querySelector('.theme-toggle i');
            icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            setTheme(newTheme);
        }

        // Initialize theme
        const savedTheme = localStorage.getItem('theme') || 'light';
        setTheme(savedTheme);

        const API_ENDPOINT = 'https://dynaspark.onrender.com';
        const API_KEY = ''; // No API key required currently
        let selectedVoice = 'alloy';

        // Tab switching
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('#content > div').forEach(c => c.classList.remove('active'));
            document.getElementById(`${tab}-tab`).classList.add('active');
            document.getElementById(`${tab}-content`).classList.add('active');
        }

        // Voice selection
        document.querySelectorAll('.voice-option').forEach(option => {
            option.addEventListener('click', function() {
                document.querySelectorAll('.voice-option').forEach(opt => opt.classList.remove('selected'));
                this.classList.add('selected');
                selectedVoice = this.dataset.voice;
            });
        });

        // Update rate limit info
        async function updateRateLimitInfo() {
            try {
                const response = await fetch(`${API_ENDPOINT}/api/generate_response?api_key=${API_KEY}&user_input=test`, {
                    method: 'GET'
                });
                const limit = response.headers.get('X-RateLimit-Limit');
                const remaining = response.headers.get('X-RateLimit-Remaining');
                const reset = response.headers.get('X-RateLimit-Reset');
                
                if (limit && remaining) {
                    const resetDate = new Date(reset * 1000).toLocaleTimeString();
                    document.getElementById('rate-limit-info').innerHTML = 
                        `Rate Limit: ${remaining}/${limit} requests remaining. Resets at ${resetDate}`;
                }
            } catch (error) {
                console.error('Error fetching rate limit info:', error);
            }
        }

        // Chat functionality
        async function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (!message) return;

            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML += `<div class="message user-message">${message}</div>`;
            input.value = '';

            const loadingMessage = document.createElement('div');
            loadingMessage.className = 'message ai-message';
            loadingMessage.textContent = 'AI is thinking...';
            chatBox.appendChild(loadingMessage);
            chatBox.scrollTop = chatBox.scrollHeight;

            const params = new URLSearchParams({
                api_key: API_KEY,
                user_input: message,
                model: document.getElementById('text-model').value,
                temperature: document.getElementById('temperature').value,
                top_p: document.getElementById('top-p').value,
                presence_penalty: document.getElementById('presence-penalty').value,
                frequency_penalty: document.getElementById('frequency-penalty').value
            });

            try {
                const response = await fetch(`${API_ENDPOINT}/api/generate_response?${params}`);
                let data;
                
                // Try to parse as JSON first
                const contentType = response.headers.get('content-type');
                if (contentType && contentType.includes('application/json')) {
                    data = await response.json();
                    if (data.response) {
                        chatBox.removeChild(loadingMessage);
                        chatBox.innerHTML += `<div class="message ai-message">${data.response}</div>`;
                    } else {
                        throw new Error('Invalid response format from server');
                    }
                } else {
                    // If not JSON, read as text
                    const text = await response.text();
                    chatBox.removeChild(loadingMessage);
                    chatBox.innerHTML += `<div class="message ai-message">${text}</div>`;
                }
                
                updateRateLimitInfo();
            } catch (error) {
                chatBox.removeChild(loadingMessage);
                chatBox.innerHTML += `<div class="message error-message">Error: ${error.message}</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Image generation
        async function generateImage() {
            const prompt = document.getElementById('image-prompt').value.trim();
            if (!prompt) {
                alert('Please enter an image description.');
                return;
            }

            const loading = document.getElementById('loading');
            const imageLoading = document.getElementById('image-loading');
            const response = document.getElementById('image-response');
            loading.style.display = 'block';
            imageLoading.style.display = 'none';
            response.innerHTML = '';
            document.getElementById('download-image').style.display = 'none';

            const params = new URLSearchParams({
                api_key: API_KEY,
                user_input: prompt,
                width: document.getElementById('image-width').value,
                height: document.getElementById('image-height').value,
                model: document.getElementById('image-model').value,
                nologo: document.getElementById('nologo').checked
            });

            // Add custom watermark if enabled and text is provided
            const watermarkText = document.getElementById('watermark-text').value.trim();
            if (document.getElementById('nologo').checked && watermarkText) {
                params.append('wm', watermarkText);
            }

            try {
                // First, get the image URL
                const apiResponse = await fetch(`${API_ENDPOINT}/api/generate_image?${params}`);
                const data = await apiResponse.json();
                
                // Hide generation loading, show image loading
                loading.style.display = 'none';
                imageLoading.style.display = 'flex';
                
                // Create and load the image
                const img = new Image();
                img.onload = () => {
                    imageLoading.style.display = 'none';
                    response.innerHTML = `<img id="generated-image" src="${data.image_url}" alt="Generated Image">`;
                    document.getElementById('download-image').style.display = 'block';
                };
                img.onerror = () => {
                    imageLoading.style.display = 'none';
                    response.innerHTML = `<div class="message error-message">Error: Failed to load image</div>`;
                };
                img.src = data.image_url;

                // Set up download button
                const downloadBtn = document.getElementById('download-image');
                downloadBtn.onclick = async () => {
                    try {
                        // Fetch the image as a blob
                        const imageResponse = await fetch(data.image_url);
                        const blob = await imageResponse.blob();
                        
                        // Create a blob URL and trigger download
                        const blobUrl = window.URL.createObjectURL(blob);
                        const link = document.createElement('a');
                        link.href = blobUrl;
                        link.download = `dynaspark-image-${Date.now()}.png`;
                        document.body.appendChild(link);
                        link.click();
                        
                        // Cleanup
                        document.body.removeChild(link);
                        window.URL.revokeObjectURL(blobUrl);
                    } catch (error) {
                        alert('Error downloading image: ' + error.message);
                    }
                };
                
                updateRateLimitInfo();
            } catch (error) {
                loading.style.display = 'none';
                imageLoading.style.display = 'none';
                response.innerHTML = `<div class="message error-message">Error: ${error.message}</div>`;
            }
        }

        // Audio generation
        async function generateAudio() {
            const prompt = document.getElementById('audio-prompt').value.trim();
            if (!prompt) {
                alert('Please enter text to convert to speech.');
                return;
            }

            const loading = document.getElementById('audio-loading');
            const response = document.getElementById('audio-response');
            loading.style.display = 'block';
            response.innerHTML = '';

            const params = new URLSearchParams({
                api_key: API_KEY,
                user_input: prompt,
                model: 'openai-audio',
                voice: selectedVoice
            });

            try {
                const apiResponse = await fetch(`${API_ENDPOINT}/api/generate_response?${params}`);
                if (!apiResponse.ok) throw new Error('Audio generation failed');
                
                const blob = await apiResponse.blob();
                const audioUrl = URL.createObjectURL(blob);
                response.innerHTML = `
                    <audio controls class="audio-player">
                        <source src="${audioUrl}" type="audio/mpeg">
                        Your browser does not support the audio element.
                    </audio>`;
                updateRateLimitInfo();
            } catch (error) {
                response.innerHTML = `<div class="message error-message">Error: ${error.message}</div>`;
                } finally {
                loading.style.display = 'none';
            }
        }

        // Event listeners
        document.getElementById('chat-send').addEventListener('click', sendChatMessage);
        document.getElementById('chat-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendChatMessage();
            }
        });
        document.getElementById('image-generate').addEventListener('click', generateImage);
        document.getElementById('audio-generate').addEventListener('click', generateAudio);

        // Add watermark toggle functionality
        document.getElementById('nologo').addEventListener('change', function() {
            const watermarkInput = document.getElementById('watermark-input');
            if (this.checked) {
                watermarkInput.classList.add('active');
            } else {
                watermarkInput.classList.remove('active');
            }
        });

        // Initial rate limit check
        updateRateLimitInfo();
    </script>
</body>
</html>
